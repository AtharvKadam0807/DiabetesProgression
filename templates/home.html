<!DOCTYPE html>
<html >

<head>
  <meta charset="UTF-8">
  <title>ML API</title>
  <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
<link href='https://fonts.googleapis.com/css?family=Arimo' rel='stylesheet' type='text/css'>
<link href='https://fonts.googleapis.com/css?family=Hind:300' rel='stylesheet' type='text/css'>
<link href='https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300' rel='stylesheet' type='text/css'>

  
</head>

<body>
 <div class="login">
	<h1>Diabetes Progression Prediction</h1>

     <!-- Main Input For Receiving Query to our ML -->
    <form action="{{ url_for('predict')}}"method="post">
      <input type="text" name="AGE" placeholder="AGE" required="required" /><br>
    	<input type="text" name="Sex" placeholder="1 for Male and 2 for Female" required="required" /><br>
        <input type="text" name="BMI" placeholder="BMI" required="required" /><br>
        <input type="text" name="BP" placeholder="BP" required="required" /><br>
        <input type="text" name="S1" placeholder="Total serum cholesterol (130-170)" required="required" /><br>
        <input type="text" name="S2" placeholder="low-density lipoproteins (80-120)" required="required" /><br>
        <input type="text" name="S3" placeholder="high-density lipoproteins (40-70)" required="required" /><br>
        <input type="text" name="S4" placeholder="total cholesterol / HDL (3-6)" required="required" /><br>
        <input type="text" name="S5" placeholder="possibly log of serum triglycerides level (4-5)" required="required" /><br>
        <input type="text" name="S6" placeholder="blood sugar level (80-120)" required="required" /><br>
       

        <button type="submit" class="btn btn-primary btn-block btn-large">Predict</button>
    </form>

   <br>
   <br>
  
   
 </div>
 {{prediction_text}}

</body>
</html>
